global:
  scrape_interval: 10s

scrape_configs:
  - job_name: lancamentos-api
    metrics_path: /metrics
    static_configs: [{targets: ["lancamentos-api:8000"]}]

  - job_name: lancamentos-outbox-relay
    static_configs: [{targets: ["lancamentos-outbox-relay:9100"]}]

  - job_name: consolidado-api          # descobre todas as réplicas via DNS
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["consolidado-api"]
        type: A
        port: 8000

  - job_name: consolidado-consumer
    static_configs: [{targets: ["consolidado-consumer:9100"]}]
