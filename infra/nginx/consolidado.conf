# Balanceador de carga do Consolidado: distribui as leituras entre as réplicas.
upstream consolidado {
    server consolidado-api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;

    location / {
        proxy_pass http://consolidado;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        # Se uma réplica falhar, tenta a próxima (resiliência nas leituras)
        proxy_next_upstream error timeout http_502 http_503;
    }
}
